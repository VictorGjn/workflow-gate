<!doctype html>
<meta charset="utf-8">
<title>Workflow plan gate</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- Parsing runs here, not in the server: acorn from a CDN keeps the plugin at zero node deps. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/acorn/8.14.0/acorn.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.30.2/cytoscape.min.js"></script>
<!-- Layered layout for a real flowchart. cytoscape-dagre is not on cdnjs; jsdelivr serves the UMD
     build (global `cytoscapeDagre`, needs global `dagre` first). Offline: breadthfirst fallback. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/dagre/0.8.5/dagre.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/cytoscape-dagre@2.5.0/cytoscape-dagre.min.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* One interactive hue (cobalt) for selection and the primary button. Edges are ink, never accent.
     Run status has its own trio so "done" can never be confused with "edited" or "selected". */
  :root {
    --bg: #f3f4f7; --panel: #fff; --lane: #eaecf1; --ink: #14171f; --dim: #7b8394; --ink-2: #4b5262;
    --line: #dfe2e9; --edge: #5b6272; --accent: #2f5bea; --accent-ink: #fff;
    --ok: #1f8a4c; --run: #b7791f; --err: #c6362b; --warn: #b7791f; --visited: #7b8394;
    --chip: #e9edff; --chip-ink: #2544b8; --mono-bg: #f7f8fb;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1116; --panel: #171a21; --lane: #14171e; --ink: #e6e8ee; --dim: #7f8797; --ink-2: #b3b9c7;
            --line: #262b36; --edge: #8a92a6; --accent: #7c9bff; --accent-ink: #0f1116;
            --ok: #4cc47f; --run: #e0a54a; --err: #f07a6e; --warn: #e0a54a; --visited: #7f8797;
            --chip: #1f2a4d; --chip-ink: #b7c6ff; --mono-bg: #11141a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: grid; grid-template-rows: auto 1fr auto;
         background: var(--bg); color: var(--ink);
         font: 13.5px/1.45 "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  code, pre, textarea, .mono { font-family: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }
  .canvas { position: relative; min-height: 0; }
  .legend { position: absolute; left: 12px; bottom: 10px; display: grid; gap: 4px; font-size: 11.5px; color: var(--ink-2);
            background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 11px; pointer-events: none; }
  .legend div { display: flex; align-items: center; gap: 8px; }
  .legend svg { width: 34px; height: 10px; overflow: visible; }
  .legend path { fill: none; stroke: var(--edge); stroke-width: 1.6; }
  .legend .back { stroke: var(--run); stroke-dasharray: 6 5; }
  .legend .err { stroke: var(--err); stroke-dasharray: 6 5; }
  .legend .data { stroke-dasharray: 2 4; stroke-opacity: .6; }
  .legend .dia { fill: var(--lane); stroke: var(--edge); stroke-width: 1.2; }
  .chip { display: inline-block; padding: 0 5px; border-radius: 4px; font-size: 11px; background: var(--chip); color: var(--chip-ink);
          font-family: "IBM Plex Mono", ui-monospace, monospace; }
  .chip.go { cursor: pointer; text-decoration: underline dotted; }
  aside section + section { margin-top: 18px; }
  aside section h2 { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  aside section h2 .mono, aside section h2 .dim { letter-spacing: 0; text-transform: none; font-weight: 400; }
  .rows { display: grid; grid-template-columns: 82px 1fr; row-gap: 6px; column-gap: 10px; font-size: 12.5px; align-items: baseline; margin: 0; }
  .rows dt { color: var(--dim); } .rows dd { margin: 0; } .rows small, .ctx small { display: block; color: var(--dim); font-size: 11px; }
  .dim { color: var(--dim); }
  .ctx { display: grid; gap: 6px; font-size: 12.5px; }
  .ctx div { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: baseline; }
  .sentence { font-size: 12.5px; color: var(--ink-2); border-left: 2px solid var(--line); padding-left: 10px; margin: 10px 0 0; }
  .sentence b, .ctx b { color: var(--ink); font-weight: 600; }
  header { padding: 10px 16px; border-bottom: 1px solid var(--line); display: flex;
           align-items: baseline; gap: 12px; flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .meta { color: var(--dim); font-size: 12px; }
  header .meta.over { color: var(--err); font-weight: 600; }
  main { display: grid; grid-template-columns: 1fr 380px; min-height: 0; }
  #cy { min-height: 0; background: var(--bg); }
  aside { border-left: 1px solid var(--line); background: var(--panel); overflow-y: auto; padding: 16px; }
  aside h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em;
             color: var(--dim); margin: 0 0 12px; font-weight: 600; }
  label { display: block; font-size: 12px; color: var(--dim); margin: 14px 0 4px; }
  textarea, select, input { width: 100%; font: inherit; color: var(--ink); background: var(--bg);
                            border: 1px solid var(--line); border-radius: 6px; padding: 8px; }
  textarea { min-height: 220px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; resize: vertical; }
  footer { border-top: 1px solid var(--line); padding: 10px 16px; display: flex; gap: 10px;
           align-items: center; background: var(--panel); }
  button { font: inherit; padding: 8px 16px; border-radius: 6px; border: 1px solid var(--line);
           background: var(--bg); color: var(--ink); cursor: pointer; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  button.primary:disabled { background: var(--dim); border-color: var(--dim); }
  .grow { flex: 1; }
  footer a { font-size: 12px; color: var(--dim); text-decoration: none; border-bottom: 1px dotted var(--line); }
  footer a:hover { color: var(--accent); }
  .status { font-size: 12px; color: var(--dim); }
  .status.blocked { color: var(--err); }
  footer label.cap { font-size: 12px; color: var(--dim); white-space: nowrap; }
  footer label.cap input { width: 6.5em; padding: 6px 8px; }
  #waiting { color: var(--warn); }
  #eyes { color: var(--warn); text-decoration: none; border-bottom: 1px dotted var(--warn); }
  .pill { display: inline-block; padding: 1px 7px; border-radius: 99px; font-size: 11px;
          border: 1px solid var(--line); color: var(--dim); }
  .errors { margin: 12px 0 0; padding: 0; list-style: none; font-size: 12px; }
  .errors li { color: var(--err); cursor: pointer; padding: 3px 0; }
  .empty { color: var(--dim); font-size: 13px; }
  .note { font-size: 12px; color: var(--dim); border-left: 2px solid var(--line);
          padding-left: 10px; margin-top: 16px; }
  code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; }
  /* Approved: the plan is frozen. The controls stay visible (the reviewer still reads them)
     but cannot pretend to change a script that has already been written and fingerprinted. */
  body.live aside textarea, body.live aside select, body.live aside input,
  body.live #undo, body.live #redo { pointer-events: none; opacity: .5; }
  pre.assembled { max-height: 220px; overflow: auto; white-space: pre-wrap; word-break: break-word;
                  background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
                  padding: 8px; font-family: ui-monospace, Menlo, Consolas, monospace;
                  font-size: 11px; line-height: 1.45; margin: 0; color: var(--dim); }
</style>

<header>
  <h1>Workflow plan gate</h1>
  <span class="meta" id="hdr">loading…</span>
  <span class="meta" id="waiting" hidden></span>
  <span class="meta" id="since" hidden></span>
  <a class="meta" id="eyes" hidden href="#" title="The call sites worth reading first — cost and side-effect lints. Click to step through them. They never block or allow Approve."></a>
  <span class="meta dim" id="jev" hidden title="Intent and model routing by Jev (TypeSafe System One). Advice only — the decision is still yours."></span>
  <span class="grow"></span>
</header>

<main>
  <div class="canvas">
    <div id="cy" style="position:absolute;inset:0"></div>
    <div class="legend" aria-label="Legend">
      <div><svg viewBox="0 0 34 10"><path d="M0 5 H30"/></svg>then — runs next</div>
      <div><svg viewBox="0 0 34 10"><path class="dia" d="M17 0 L34 5 L17 10 L0 5 Z"/></svg>decision — yes / no, the JS predicate verbatim</div>
      <div><svg viewBox="0 0 34 10"><path class="back" d="M0 5 H30"/></svg>again — loops back</div>
      <div><svg viewBox="0 0 34 10"><path class="err" d="M0 5 H30"/></svg>on error — catch path</div>
      <div><svg viewBox="0 0 34 10"><path class="data" d="M0 5 H30"/></svg>reuses an earlier result</div>
    </div>
  </div>
  <aside id="panel"><p class="empty">Select an agent to read and edit its mission.</p></aside>
</main>

<footer>
  <button id="undo" disabled>Undo</button>
  <button id="redo" disabled>Redo</button>
  <button id="showrun" hidden title="Paint the newest recorded run of this script onto the graph">Show last run</button>
  <a id="history" hidden target="_blank" rel="noopener noreferrer" title="Every run on this machine, what each cost, and your notes on them">History &amp; cost ↗</a>
  <span class="grow"></span>
  <span class="status" id="status"></span>
  <button id="cancel">Cancel</button>
  <label class="cap" title="Optional. The live view turns red and notifies you at 80% and 100% of it. Nothing stops the run: only Claude Code can (/workflows).">cap $ <input id="cap" type="number" min="0" step="0.5" inputmode="decimal" placeholder="none"></label>
  <button id="approve" class="primary" disabled>Approve &amp; run</button>
</footer>

<script>
const NONCE = '__NONCE__';
const SCRIPT_NAME = '__SCRIPT_PATH__'.split(/[\\/]/).pop() || 'script';
// Filled in by the server when a history daemon is running; blank otherwise, and then no link.
const HISTORY_URL = '__HISTORY_URL__';
const q = (p) => p + (p.includes('?') ? '&' : '?') + 'n=' + NONCE;

// ---------------------------------------------------------------- parse
// Extract the declarative skeleton only: agent() calls, their mission/model/label/phase, and byte
// spans for the editable leaves. Imperative control flow is read for context but never rewritten.
function extract(src) {
  const ast = acorn.parse(src, {
    ecmaVersion: 'latest', sourceType: 'module',
    allowAwaitOutsideFunction: true, allowReturnOutsideFunction: true, allowHashBang: true,
  });

  const nodes = [];
  const phases = [];
  const flags = { loop: false, budget: /\bbudget\s*\./.test(src), nested: false };
  const lit = (v) => (v?.type === 'Literal' ? v.value : null);
  const isCall = (n, re) => n?.type === 'CallExpression' && n.callee?.type === 'Identifier' && re.test(n.callee.name);

  // meta.phases — the declared execution order.
  walk(ast, (n) => {
    if (n.type !== 'Property' || n.key?.name !== 'phases' || n.value?.type !== 'ArrayExpression') return;
    for (const el of n.value.elements || []) {
      const t = el?.properties?.find((p) => p.key?.name === 'title');
      if (t?.value?.value) phases.push(t.value.value);
    }
  });

  // Module-scope `const X = [...]` — a fan-out over X is statically sized, and per-item labels can
  // be resolved when the label is `prefix:${d.slug}` and each element carries a literal `slug`.
  const arrays = {};
  for (const st of ast.body) {
    if (st.type !== 'VariableDeclaration' || st.kind !== 'const') continue;   // a `let` can be resized later
    for (const d of st.declarations) if (d.id?.type === 'Identifier' && d.init?.type === 'ArrayExpression') arrays[d.id.name] = d.init;
  }

  // Named functions passed as pipeline()/parallel() stages: agent() calls inside them run once per
  // item, but sit lexically OUTSIDE the call — v1 saw no fan-out at all there.
  const stageFns = {};   // fn name → { over, index, call }
  const fnBodies = {};   // fn name → function node
  walk(ast, (n) => {
    if (n.type === 'FunctionDeclaration' && n.id) fnBodies[n.id.name] = n;
    if (n.type === 'VariableDeclarator' && n.id?.type === 'Identifier' && /Function/.test(n.init?.type || '')) fnBodies[n.id.name] = n.init;
    if (!isCall(n, /^pipeline$/)) return;
    n.arguments.slice(1).forEach((a, i) => { if (a.type === 'Identifier') stageFns[a.name] = { over: sourceOf(src, n.arguments[0]), index: i + 1, call: n }; });
  });

  // phase('X') calls, in statement order — the documented default grouping. Only opts.phase wins.
  const phaseCalls = [];
  walk(ast, (n) => { if (isCall(n, /^phase$/) && lit(n.arguments[0])) phaseCalls.push({ at: n.start, title: n.arguments[0].value }); });
  const phaseAt = (pos) => { let t = null; for (const p of phaseCalls) if (p.at < pos) t = p.title; return t; };

  // Every agent() / workflow() call site. `stack` = enclosing nodes, innermost first.
  const sites = [];
  walkWithStack(ast, (n, stack) => {
    const isAgent = isCall(n, /^agent$/), isWf = isCall(n, /^workflow$/);
    if (!isAgent && !isWf) return;
    const [promptArg, optsArg] = n.arguments;
    const opts = {};
    if (optsArg?.type === 'ObjectExpression') for (const p of optsArg.properties) if (p.key?.name) opts[p.key.name] = p.value;

    // Mission span: for a template literal we edit the LAST static chunk (the tail after any
    // ${interpolation}), so shared prefixes stay shared. For a plain string, the whole literal.
    let missionSpan = null, mission = '', missionKind = null, assembled = '';
    if (isAgent && promptArg?.type === 'TemplateLiteral') {
      const tail = promptArg.quasis[promptArg.quasis.length - 1];
      missionSpan = [tail.start, tail.end];
      mission = src.slice(tail.start, tail.end);
      missionKind = promptArg.expressions.length ? 'template-tail' : 'template';
      // The whole prompt as the agent will receive it, each interpolation as a placeholder. An
      // emptiness check on the tail alone would block Approve on any prompt ending in ${...}.
      assembled = promptArg.quasis
        .map((qq, i) => qq.value.raw + (promptArg.expressions[i] ? '⟨' + sourceOf(src, promptArg.expressions[i]) + '⟩' : ''))
        .join('');
    } else if (isAgent && promptArg?.type === 'Literal' && typeof promptArg.value === 'string') {
      missionSpan = [promptArg.start + 1, promptArg.end - 1];
      mission = src.slice(missionSpan[0], missionSpan[1]);
      missionKind = 'string';
      assembled = promptArg.value;
    } else if (promptArg) {
      assembled = '⟨' + sourceOf(src, promptArg) + '⟩';   // computed prompt: shown, never editable
    }

    // Fan-out: an enclosing parallel()/pipeline() sized by its first argument. ONE template node
    // with a multiplicity, never N nodes. A module-scope literal array gives a real count.
    let fanOut = null, stage = null;
    for (const anc of stack) {
      if (!isCall(anc, /^(parallel|pipeline)$/)) continue;
      const first = anc.arguments[0];
      if (anc.callee.name === 'pipeline') {
        const idx = anc.arguments.slice(1).findIndex((a) => stack.includes(a));
        if (idx >= 0) stage = { call: anc, index: idx + 1 };
      }
      const fo = sizeFanOut(src, first, arrays, stack);
      if (!fo) continue;                 // parallel([thunk, thunk]) — each thunk is its own site
      fanOut = fanOut || fo;
      if (fanOut.n === null) break;
    }
    // …or the call lives in a named function that pipeline() runs per item.
    if (!fanOut) for (const anc of stack) {
      const name = anc.type === 'FunctionDeclaration' ? anc.id?.name : null;
      const asVar = stack.find((s) => s.type === 'VariableDeclarator' && s.init === anc)?.id?.name;
      const hit = stageFns[name] || stageFns[asVar];
      if (hit) { fanOut = { n: null, over: hit.over, labels: null }; stage = { call: hit.call, index: hit.index }; break; }
    }

    // `agent(d.prompt)` inside a fan-out over a literal array: the prompt is not editable (it is
    // per item) but it IS knowable — resolve every item's prompt so the face and panel show text
    // instead of "⟨d.prompt⟩" for the one node that launches most of the agents.
    if (fanOut?.items && promptArg?.type === 'MemberExpression' && promptArg.object?.name === fanOut.param && promptArg.property?.name) {
      const prop = promptArg.property.name;
      const per = fanOut.items.map((el) => { const p = el?.type === 'ObjectExpression' ? el.properties.find((q) => q.key?.name === prop) : null; return p ? assembleOf(src, p.value) : null; });
      if (per.every((x) => x !== null)) { fanOut.prompts = per; assembled = per[0]; }
    }
    if (fanOut) delete fanOut.items;

    // Guard: the innermost condition or loop enclosing the call. A guarded site contributes 0 to the
    // lower bound — counting it as 1 is how v1 reported MORE agents than actually ran.
    let guard = null;
    for (let i = 0; i < stack.length; i++) {
      const anc = stack[i], prev = i === 0 ? n : stack[i - 1];   // the child of anc on our path
      if (anc.type === 'IfStatement' && prev !== anc.test) { guard = { kind: 'if', text: sourceOf(src, anc.test, 60), line: lineOf(src, anc.start), else: prev === anc.alternate }; break; }
      if (anc.type === 'ConditionalExpression' && prev !== anc.test) { guard = { kind: 'if', text: sourceOf(src, anc.test, 60), line: lineOf(src, anc.start), else: prev === anc.alternate }; break; }
      if (anc.type === 'LogicalExpression' && prev === anc.right) { guard = { kind: 'if', text: sourceOf(src, anc.left, 60), line: lineOf(src, anc.start), else: anc.operator === '||' }; break; }
      if (anc.type === 'SwitchCase') { guard = { kind: 'if', text: anc.test ? 'case ' + sourceOf(src, anc.test, 60) : 'default', line: lineOf(src, anc.start), else: !anc.test }; break; }
      if (/^(While|DoWhile|For|ForOf|ForIn)Statement$/.test(anc.type) && prev !== anc.test) { guard = { kind: 'loop', text: sourceOf(src, anc.test || anc.right || anc, 60), line: lineOf(src, anc.start), else: false }; flags.loop = true; break; }
      if (anc.type === 'CatchClause') { guard = { kind: 'if', text: 'catch — only after a failure', line: lineOf(src, anc.start), else: false }; break; }
    }
    // A helper function is called ? times (maybe never): agent() inside one is not a sure launch.
    // Thunks in parallel([...]), .map callbacks, inline stages and IIFEs are the caller's shape and
    // count normally; a pipeline stage function is already a runtime fan-out.
    if (!guard && !stage) for (let i = 0; i < stack.length; i++) {
      const f = stack[i];
      if (!/Function/.test(f.type)) continue;
      // Skip nested arrows (`(d) => () => agent()`): what matters is where the outermost one sits.
      let j = i; while (/Function/.test(stack[j + 1]?.type || '')) j++;
      const parent = stack[j + 1];
      const helper = f.type === 'FunctionDeclaration' || stack[j].type === 'FunctionDeclaration'
        || (parent && /^(VariableDeclarator|Property|AssignmentExpression)$/.test(parent.type));
      if (!helper) break;
      const name = stack[j].id?.name || (parent?.type === 'VariableDeclarator' ? parent.id?.name : parent?.key?.name || parent?.left?.name) || '(anonymous)';
      guard = { kind: 'fn', text: `inside ${name}() — called ? times`, line: lineOf(src, f.start), else: false };
      break;
    }
    // An earlier `if (...) return` / `throw` in the same block can skip everything after it.
    if (!guard) for (let i = 0; i < stack.length; i++) {
      const blk = stack[i]; if (blk.type !== 'BlockStatement' && blk.type !== 'Program') continue;
      const mine = i === 0 ? n : stack[i - 1];
      const exits = (blk.body || []).filter((st) => st.end <= mine.start && st.type === 'IfStatement' && hasExit(st));
      if (exits.length) { guard = { kind: 'if', text: 'after early exit: ' + sourceOf(src, exits[exits.length - 1].test, 50), line: lineOf(src, exits[exits.length - 1].start), else: false }; break; }
      if (/Function/.test(stack[i + 1]?.type || '')) break;   // do not look past our own function
    }

    // Where `model:` can be spliced in when the call has none: after the options' `{`, or as a new
    // options argument. Never beside a spread, a computed or quoted-model key, or a variable: any of
    // them could already set the model, and an insert would then change bytes but not behaviour.
    // A spread argument hides which position the options land in: `agent(...args, { model })` may be a
    // third argument the call ignores while this page reads it as the options.
    const modelInsert = !isAgent || opts.model || n.arguments.some((a) => a.type === 'SpreadElement') ? null
      : optsArg?.type === 'ObjectExpression'
        ? (optsArg.properties.some((p) => p.type !== 'Property' || p.computed || (p.key?.name ?? p.key?.value) === 'model') ? null
          : { at: optsArg.start + 1, empty: !optsArg.properties.length })
        : !optsArg && promptArg && n.arguments.length === 1 ? { at: promptArg.end, arg: true } : null;
    // The innermost loop whose BODY holds the call, and whether its pass count is a literal: for-of
    // over an inline or module-const array, or `i < 5`. Anything else is unbounded to this page.
    const loopAnc = stack.find((a, i) => /^(While|DoWhile|For|ForOf|ForIn)Statement$/.test(a.type) && (i === 0 ? n : stack[i - 1]) !== a.test);
    const loop = loopAnc ? { id: 'd' + loopAnc.start, bounded: /^For(Of|In)Statement$/.test(loopAnc.type)
      ? loopAnc.right?.type === 'ArrayExpression' || (loopAnc.right?.type === 'Identifier' && !!arrays[loopAnc.right.name])
      : loopAnc.type === 'ForStatement' && /^<=?$/.test(loopAnc.test?.operator || '') && typeof loopAnc.test.right?.value === 'number' } : null;
    const labelDynamic = !!opts.label && opts.label.type !== 'Literal';
    const optVal = (k) => (opts[k] == null ? null : lit(opts[k]) ?? 'computed');
    const schema = opts.schema?.type === 'ObjectExpression' ? opts.schema.properties.find((p) => p.key?.name === 'properties')?.value : null;
    if (isWf) flags.nested = true;
    const id = 'a' + nodes.length;
    const node = {
      id, kind: isWf ? 'workflow' : 'agent',
      label: isWf ? 'workflow: ' + (lit(promptArg) ?? sourceOf(src, promptArg)) : (lit(opts.label) || (labelDynamic ? sourceOf(src, opts.label) : `agent ${nodes.length + 1}`)),
      labelDynamic,
      model: optVal('model') || 'inherited',
      modelText: opts.model && !lit(opts.model) ? '⟨' + sourceOf(src, opts.model, 60) + '⟩' : null,
      modelSpan: opts.model?.type === 'Literal' ? [opts.model.start, opts.model.end] : null, modelInsert,
      effort: optVal('effort'),
      effortSpan: opts.effort?.type === 'Literal' ? [opts.effort.start, opts.effort.end] : null,
      isolation: optVal('isolation'), agentType: optVal('agentType'),
      schemaKeys: schema?.type === 'ObjectExpression' ? schema.properties.map((p) => p.key?.name || p.key?.value).filter(Boolean) : (opts.schema ? ['⟨' + sourceOf(src, opts.schema) + '⟩'] : null),
      phase: lit(opts.phase) || phaseAt(n.start),
      mission, missionSpan, missionKind, assembled,
      fanOut, guard, loop,
      // What the prompt tells the agent to write. A static grep, honestly labelled as such.

  for (const k in node) {
    const v = node[k];
    if (Array.isArray(v)) v.forEach((c) => walkWithStack(c, fn, next));
    else if (v && typeof v.type === 'string') walkWithStack(v, fn, next);

}

// ---------------------------------------------------------------- splice
// Byte splicing, not re-printing. Untouched regions are literally never re-emitted, so a no-op edit
// is byte-identical by construction. The gate fingerprints hash(script text) — anything less exact
// re-triggers the gate forever.
//
// The mission textarea is a TRUST BOUNDARY: free human text becomes executable JS. Splicing it raw
// is not a rough edge, it is three bugs — an apostrophe or newline writes a SyntaxError to the
// user's file; a backtick ends the template early; and `${process.env.X}` typed as prose becomes a
// LIVE interpolation in a script the gate then marks approved. Escape for the literal kind we are
// splicing into. Verified against all four in the format-variant harness.
function escapeForSpan(text, kind) {
  if (kind === 'string') {
    // JSON.stringify handles quotes, backslashes, newlines and control chars; drop its own quotes
    // because the source's delimiters stay in place around the span.
    const json = JSON.stringify(text).slice(1, -1);
    // JSON only escapes ", so a source using ' needs its own delimiter escaped too. Escaping both
    // is always valid JS regardless of which delimiter the source used.
    return json.replace(/'/g, "\\'");
  }
  // Template literal: a backtick would close it, and ${ would open an interpolation. Backslash must
  // go first or it would double-escape what we add after.
  return text.replace(/\\/g, '\\\\').replace(/`/g, '\\`').replace(/\$\{/g, '\\${');
}

const TIERS = ['fable', 'opus', 'sonnet', 'haiku'];
function applyEdits(src, nodes, edits) {
  const ops = [];
  for (const n of nodes) {
    const e = edits[n.id];
    if (!e) continue;
    if (e.mission !== undefined && n.missionSpan) ops.push({ span: n.missionSpan, text: escapeForSpan(e.mission, n.missionKind) });
    // An inherited model gets a new `model:` key, and only a known tier: 'inherited' is the absence
    // of the key, never a value to write.
    if (e.model !== undefined && !n.modelSpan && n.modelInsert && TIERS.includes(e.model)) {
      const kv = `model: '${e.model}'`, at = n.modelInsert.at;
      ops.push({ span: [at, at], text: n.modelInsert.arg ? `, { ${kv} }` : n.modelInsert.empty ? ` ${kv} ` : ` ${kv},` });
    }
    // Tier and effort are bare identifiers-in-quotes; a value outside [a-z0-9.-] would be a bug
    // in the select, not in the script, so refuse rather than escape.
    for (const [k, span] of [['model', n.modelSpan], ['effort', n.effortSpan]]) {
      if (e[k] === undefined || !span || !/^[a-z0-9.-]+$/i.test(e[k])) continue;
      const quote = src[span[0]];   // reuse the source's own delimiter, never emit one
      ops.push({ span, text: quote + e[k] + quote });
    }
  }
  ops.sort((a, b) => b.span[0] - a.span[0]);   // right-to-left keeps earlier offsets valid
  let out = src;
  for (const o of ops) out = out.slice(0, o.span[0]) + o.text + out.slice(o.span[1]);
  return out;
}

// A tier edit, checked before it is taken: the spliced script must parse AND re-extract with that
// tier on that call site — a parse alone would pass an insert some other key silently overrides.
function withModel(src, nodes, edits, id, tier) {
  const next = { ...edits, [id]: { ...edits[id], model: tier } };
  let g;
  try { g = extract(applyEdits(src, nodes, next)); } catch (e) { return { error: `the edited script would not parse (${e.message})` }; }
  const i = nodes.findIndex((x) => x.id === id);
  if (g.nodes[i]?.model !== tier) return { error: `the call would still not run on ${tier}` };
  return { edits: next };
}

// What the differing suggestions are worth, from the server's per-token price table (cost.mjs). No
// run-size estimate: the ratio is exact, a dollar figure would not be. The page does not know the
// session's model, so an inherited one is priced as opus and says so.
// ponytail: per-token ratio only; a $/run delta needs per-label token priors from run history.
function priceDelta(nodes, advice, modelOf) {
  const P = advice?.prices || {}, groups = {};
  for (const n of nodes) {
    const tip = advice?.agents?.[n.id], cur = modelOf(n);
    if (!tip?.tier || tip.tier === cur) continue;
    const from = cur === 'inherited' ? 'opus' : cur;
    if (!P[from] || !P[tip.tier]) continue;
    const g = groups[tip.tier + '<' + cur] ||= { to: tip.tier, from, inherited: cur === 'inherited', n: 0 };
    g.n++;
  }
  return Object.values(groups).map((g) => {
    const r = P[g.to] / P[g.from];
    return `${g.to} ≈ ${r < 1 ? '1/' + +(1 / r).toFixed(1) : '×' + +r.toFixed(1)} the per-token price of ${g.inherited ? 'inherited (priced as opus)' : g.from} on ${g.n} agent${g.n === 1 ? '' : 's'}`;
  });
}

// "Needs your eyes": the few call sites worth reading first. Structural rules are code, over what
// extract() already knows; the side-effect flag is Jev's (advice, shown with its probability). The
// output is a highlight and a list — it never enables, disables or gates Approve.
// ponytail: weights are hand-set, not fitted; calibrate on recorded runs before trusting the order.
const LINTS = [
  { id: 'top-tier-fanout', w: 3, test: (n, m) => n.fanOut?.n === null && /^(opus|fable|inherited)$/.test(m),
    msg: (n, m) => `×? on ${m === 'inherited' ? "the session's model" : m} — a runtime-sized list at the top rate` },
  { id: 'unbounded-loop', w: 3, test: (n) => n.loop && !n.loop.bounded, msg: () => 'inside a loop with no literal bound — runs once per pass' },
  { id: 'wide-no-model', w: 2, test: (n, m) => n.fanOut?.n > 10 && m === 'inherited', msg: (n) => `×${n.fanOut.n} with no model: — every one on the session's model` },
];
const FX_FLOOR = 0.7;
function needsEyes(nodes, modelOf, advice, max = 3) {
  const out = [];
  for (const n of nodes) {
    if (n.kind !== 'agent') continue;
    const m = modelOf(n), why = [];
    let score = 0;
    for (const r of LINTS) if (r.test(n, m)) { score += r.w; why.push(r.msg(n, m)); }
    const fx = advice?.fx?.[n.id];
    if (fx >= FX_FLOOR) {
      score += 2 + (advice.stakes?.level ?? 1);       // a side effect weighs more on a consequential run
      why.push(`Jev (advice, ${Math.round(fx * 100)}%): the mission pushes, publishes, deploys, deletes or writes outside its folder`);
    }
    if (score) out.push({ id: n.id, score, why });
  }
  out.sort((a, b) => b.score - a.score);
  return { top: out.slice(0, max), total: out.length };
}

// What changed since the last approval of this path, call site by call site. Matched by phase +
// label first; default `agent N` labels shift when a site is inserted, so those pair by source order
// among themselves. A renamed agent reads as removed + added — honest, if noisy. Compared on what the
// agent receives (the assembled prompt, per-item prompts) and how it runs.
function diffGraphs(prev, cur, prevSrc = '', curSrc = '') {
  const key = (n) => (/^agent \d+$/.test(n.label) ? null : (n.phase || '') + '\u0000' + n.label);
  const FIELDS = {
    mission: (n) => [n.assembled, n.fanOut?.prompts || null], model: (n) => [n.model, n.modelText], effort: (n) => n.effort,
    'fan-out': (n) => (n.fanOut ? [n.fanOut.n, n.fanOut.over] : null), loop: (n) => (n.loop ? n.loop.bounded : null), condition: (n) => n.guard?.text || null,
    options: (n) => [n.agentType, n.isolation, n.schemaKeys], context: (n) => (n.context || []).map((c) => [c.expr, c.preview ?? null]),
  };
  const left = [...prev.nodes], pair = new Map();
  for (const c of cur.nodes) {
    const k = key(c), i = k === null ? -1 : left.findIndex((p) => key(p) === k);
    if (i >= 0) pair.set(c.id, left.splice(i, 1)[0]);
  }
  for (const c of cur.nodes) {
    if (pair.has(c.id) || key(c) !== null) continue;
    const i = left.findIndex((p) => key(p) === null);
    if (i >= 0) pair.set(c.id, left.splice(i, 1)[0]);
  }
  const status = {}, fields = {};
  for (const c of cur.nodes) {
    const p = pair.get(c.id);
    if (!p) { status[c.id] = 'added'; continue; }
    fields[c.id] = Object.keys(FIELDS).filter((f) => JSON.stringify(FIELDS[f](p)) !== JSON.stringify(FIELDS[f](c)));
    // The fields above are summaries (a computed prompt is cut to 40 chars): "unchanged" must mean the
    // call's own text is byte-identical, or a change past the cut would be dimmed as reviewed.
    if (!fields[c.id].length && p.callText !== c.callText) fields[c.id] = ['other code in the call'];
    status[c.id] = fields[c.id].length ? 'changed' : 'same';
  }
  const count = (s) => Object.values(status).filter((x) => x === s).length;
  // A const, helper or item list the prompts read can change with every call byte-identical, and the
  // node then reads "unchanged": say so for the script as a whole, whatever else changed.
  const bare = (src, g) => g.nodes.reduce((t, n) => (n.callText ? t.split(n.callText).join('') : t), src);
  return { status, fields, added: count('added'), changed: count('changed'), removed: left.map((p) => p.label), outside: bare(prevSrc, prev) !== bare(curSrc, cur) };
}

// ---------------------------------------------------------------- state

let ADVICE = null;            // Jev's intent + tier suggestions, keyed by node id; null until (and unless) it answers
let PRIORS = null;

let history = [], future = [];

const $ = (id) => document.getElementById(id);
const truncate = (s, n) => { const t = (s || '').trim().replace(/\s+/g, ' '); return t.length > n ? t.slice(0, n - 1) + '…' : t; };
// First sentence after any leading ⟨chips⟩: cut at . ? ! followed by space/end, or at a blank line.
const firstSentence = (s) => {
  const t = (s || '').replace(/^(\s*⟨[^⟩]*⟩\s*)+/, '').trim();
  const m = t.match(/^[\s\S]*?[.?!](?=\s|$)|^[^\n]*?(?=\n\s*\n)|^[\s\S]*$/);
  return (m ? m[0] : t).replace(/\s+/g, ' ').trim();
};
const currentMission = (n) => (edits[n.id]?.mission !== undefined ? edits[n.id].mission : n.mission);
// The full prompt as the agent will receive it, with the reviewer's pending tail edit applied.
// Everything user-facing reads THIS, not the editable fragment — active verification over a
// fragment is theatre, and on the real scripts the fragment was 16% of the prompt.
const assembledNow = (n) => (n.missionSpan && edits[n.id]?.mission !== undefined
  ? n.assembled.slice(0, n.assembled.length - n.mission.length) + edits[n.id].mission
  : n.assembled);
const currentModel = (n) => (edits[n.id]?.model !== undefined ? edits[n.id].model : n.model);
const currentEffort = (n) => (edits[n.id]?.effort !== undefined ? edits[n.id].effort : n.effort);

function pushHistory() { history.push(JSON.stringify(edits)); future = []; refreshButtons(); }
function undo() { if (!history.length) return; future.push(JSON.stringify(edits)); edits = JSON.parse(history.pop()); afterEdit(); }
function redo() { if (!future.length) return; history.push(JSON.stringify(edits)); edits = JSON.parse(future.pop()); afterEdit(); }
// refreshButtons first: nothing advisory after it may stand between an edit and the parse check.

// ---------------------------------------------------------------- render
function build() {
  const elements = [];
  for (const n of GRAPH.nodes) {
    elements.push({ data: { id: n.id, label: nodeLabel(n), kind: 'agent', guarded: !!n.guard, icon: iconOf(n) } });
  }
  // The flowchart: decisions, loops, start/end and the "then" edges between them.
  for (const n of GRAPH.flow.nodes) elements.push({ data: { id: n.id, label: n.label, kind: n.kind, line: n.line } });
  for (const e of GRAPH.flow.edges) elements.push({ data: { id: e.id, source: e.source, target: e.target, kind: e.kind, label: e.label } });
  // A data edge — a prior result interpolated into this prompt — is drawn only where the flow does
  // not already say "then" between the same two nodes: it then means "reuses an earlier result".
  const flowPairs = new Set(GRAPH.flow.edges.map((e) => e.source + '>' + e.target));
  for (const e of GRAPH.edges) {
    if (flowPairs.has(e.source + '>' + e.target)) continue;
    elements.push({ data: { id: e.id, source: e.source, target: e.target, kind: 'data', label: e.via + (e.mayContainNull ? '?' : '') } });
  }

  if (typeof cytoscapeDagre !== 'undefined' && !cytoscape.__dagre) { cytoscape.use(cytoscapeDagre); cytoscape.__dagre = true; }
  cy = cytoscape({ container: $('cy'), elements, style: buildStyle() });
  // Theme flip with the tab open used to leave the canvas in the old palette: tokens are read once.
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => cy.style(buildStyle()));
  // "If this does not fire, what else silently does not happen?" — hover a conditional node.
  cy.on('mouseover', 'node[?guarded]', (e) => e.target.successors().addClass('at-risk'));
  cy.on('mouseout', 'node[?guarded]', () => cy.elements().removeClass('at-risk'));

  // Auto-layout ONCE, then freeze: positions become the reviewer's own state. Layered (dagre) so
  // the flow reads top-down with loops as back-edges; breadthfirst from `start` when the CDN is
  // unreachable. Ceiling: dagre's crossing minimisation is heuristic past ~60 nodes.
  const layout = cytoscape.__dagre
    ? { name: 'dagre', rankDir: 'TB', nodeSep: 30, rankSep: 48, edgeSep: 14, fit: true, padding: 28 }
    : { name: 'breadthfirst', directed: true, roots: cy.$('#start'), spacingFactor: 1.05, fit: true, padding: 28 };
  cy.layout(layout).run();
  if (cy.zoom() > 1.2) { cy.zoom(1.2); cy.center(); }   // don't blow a 2-node graph up to fill the canvas

  cy.on('tap', 'node', (e) => select(e.target));
  cy.on('tap', (e) => { if (e.target === cy) { cy.$(':selected').unselect(); renderPanel(null); } });
}

async function poll() {

  const sig = JSON.stringify(RUN_OF);

});

// The needles each call site is recognised by. An edited mission tail is what the agent will
// actually receive, so it is a needle too. Sent ONCE, with the approval: the server does the search,
// because the prompts it searches run to 190 000 characters and shipping them back every three
// seconds to match here would cost more than the run.
function matchNeedles() {
  const out = {};
  for (const n of GRAPH.nodes) {
    const ed = edits[n.id]?.mission;
    out[n.id] = (ed === undefined ? n.matchChunks : [...n.matchChunks, cook(ed).trim()])
      .filter((x) => x.length >= 24);
  }
  return out;
}

// /live names the call site whenever the prompt names it unambiguously. What is left is the honest
// handling of the rest: a prompt built entirely at runtime (no literal to match) or one whose literal
// is shared by two call sites (`tied`). Those go by arrival order — among the tied sites when there
// are any — into the first with room left, and are flagged so the panel says how they got there.
function matchLive(agents) {
  for (const n of GRAPH.nodes) RUN_OF[n.id] = [];
  const spare = [];
  for (const a of agents) {
    if (a.nodeId && RUN_OF[a.nodeId]) RUN_OF[a.nodeId].push(a); else spare.push(a);
  }
  for (const a of spare) {
    const pool = a.tied?.length ? GRAPH.nodes.filter((x) => a.tied.includes(x.id)) : GRAPH.nodes;
    const n = pool.find((x) => RUN_OF[x.id].length < (x.fanOut ? (x.fanOut.n || 99) : 1)) || pool[0];
    if (!n) continue;                               // no room anywhere for THIS one; the rest may fit
    a.byOrder = true;
    RUN_OF[n.id].push(a);
  }
}

// The human's spend cap, checked by code on every poll. 0 = under 80% or no cap, 0.8, or 1 (reached).
function capLevel(cost, cap) {
  if (!(cap > 0) || !Number.isFinite(cost)) return 0;
  return cost >= cap ? 1 : cost >= 0.8 * cap ? 0.8 : 0;
}
// Red header, a tab-title prefix, and one notification per threshold crossed. No kill: stopping a
// run is Claude Code's (/workflows); enforcing a cap from here would need hooks inside Workflow
// subagents, not verified to fire.
let CAP_FIRED = 0, TITLE0 = null;
function capAlert(cost, cap) {
  const lvl = capLevel(cost, cap);
  TITLE0 ??= document.title;
  $('hdr').classList.toggle('over', lvl > 0);
  document.title = lvl ? (lvl === 1 ? '⛔ cap reached · ' : '⚠ 80% of cap · ') + TITLE0 : TITLE0;
  if (lvl <= CAP_FIRED) return;
  CAP_FIRED = lvl;
  try {
    if (window.Notification?.permission === 'granted')
      new Notification(lvl === 1 ? `Workflow spend reached your $${cap} cap` : `Workflow spend is at 80% of your $${cap} cap`,
        { body: `${usd(cost)} so far. Stop it in Claude Code (/workflows) if it should not go on.` });
  } catch { /* the red header and the title still say it */ }
}

function liveHeader(agents) {
  const done = agents.filter((a) => /done|fail/.test(a.state)).length;
  // A tab reloaded twenty minutes into a run has no idea when it started — the transcripts do.
  const t0 = Math.min(T0, ...agents.map((a) => Date.parse(a.startedAt) || Infinity));
  const s = Math.round((Date.now() - t0) / 1000);
  // The number that can still change your mind. Not a forecast — what has been spent so far.
  const money = RUN?.cost ? ` · $${RUN.cost < 100 ? RUN.cost.toFixed(2) : Math.round(RUN.cost)} so far${RUN.unpriced ? '+' : ''}`
    + (Number.isFinite(PRIORS?.p75) ? ` · p75 ${usd(PRIORS.p75)}${RUN.cost > PRIORS.p75 ? ' ↑' : ''}` : '')
    + (RUN.cap > 0 ? ` · ${Math.round(RUN.cost / RUN.cap * 100)}% of your ${usd(RUN.cap)} cap` : '') : '';
  return `running · ${done}/${agents.length} agent${agents.length === 1 ? '' : 's'} finished` + money
    + ` · approved ≥ ${GRAPH.minAgents}`
    + (agents.length > GRAPH.minAgents ? ` (${agents.length - GRAPH.minAgents} over the lower bound so far)` : '')
    + ` · ${s < 90 ? s + ' s' : Math.round(s / 60) + ' min'} elapsed · dimmed = not started`
    // A guess must never look like a fact: say when the run was bound by time, not by its prompts.
    + (RUN?.guess ? ' · ⚠ run matched by time only — it may be another workflow' : '')
    + (RUN?.outside ? ' · run found outside this session' : '');
}

// ---------------------------------------------------------------- advice (Jev)
// Sends the skeleton this page extracted — name, phases, one mission per agent, never the whole
// file — to the server, which asks Jev. Silent when the server has no key or Jev does not answer.
// A mission edit makes the advice stale, and a stale "haiku ok" on a mission that now does more is a
// trap: re-ask 2 s after the last edit that changes what Jev would be sent, keeping the old advice up
// until the new one lands. Model edits do not re-ask — the payload carries the model as written.
let adviceAsked = '', adviceSeq = 0, adviceCtl = null, adviceTimer = 0, adviceOff = false;
const skeletonNow = () => ({
  name: SRC.match(/name:\s*['"]([^'"]+)['"]/)?.[1] || null,
  description: SRC.match(/description:\s*['"]([^'"]+)['"]/)?.[1] || null,
  phases: GRAPH.phases,
  agents: GRAPH.nodes.filter((n) => n.kind === 'agent').map((n) => ({ id: n.id, label: n.label, phase: n.phase, model: n.model, mission: assembledNow(n) })),
});
function reaskAdvice() {
  if (adviceOff || DECIDED || !adviceSeq) return;     // no key, approved, or the first ask has not gone out
  clearTimeout(adviceTimer);
  adviceTimer = setTimeout(askAdvice, 2000);
}
async function askAdvice() {
  const skel = skeletonNow();
  if (!skel.agents.length) return;
  const body = JSON.stringify(skel);
  if (body === adviceAsked) return;                   // an undo back to what was asked: nothing to ask
  adviceAsked = body;
  adviceCtl?.abort();
  const ctl = adviceCtl = new AbortController(), seq = ++adviceSeq;
  let a = null;
  const busy = (on) => { $('jev').textContent = $('jev').textContent.replace(/ — re-asking…$/, '') + (on ? ' — re-asking…' : ''); };
  if (ADVICE) busy(true);
  try { a = await fetch(q('/advice'), { method: 'POST', headers: { 'content-type': 'application/json' }, body, signal: ctl.signal }).then((r) => r.json()); } catch {}
  if (seq !== adviceSeq) return;                      // a newer ask superseded this one
  // Failed: the next edit asks again, and the old advice says it may be stale.
  if (!a || !a.available) { adviceAsked = ''; busy(false); if (ADVICE) $('jev').textContent += ' — may be stale (re-ask failed)'; else adviceOff = true; return; }
  ADVICE = a;
  jevBanner();
  refreshEyes();
  // Not while the human is typing in the panel: innerHTML replacement would drop the edit without a
  // change event. The next selection shows the advice.
  if (!LIVE && !$('panel').contains(document.activeElement)) renderPanel(cy.$('node:selected').first());
}

// Recomputed on every edit and every advice answer: a lint must not keep saying "top tier" right
// after the human downgraded that agent.
let EYES = { ids: [], why: {}, at: -1 };
function refreshEyes() {
  const { top, total } = needsEyes(GRAPH.nodes, currentModel, ADVICE);
  EYES = { ids: top.map((t) => t.id), why: Object.fromEntries(top.map((t) => [t.id, t.why])), at: -1 };
  cy.elements().removeClass('eyes');
  for (const t of top) {
    cy.$id(t.id).addClass('eyes');
    const lp = GRAPH.nodes.find((x) => x.id === t.id).loop;
    if (lp && !lp.bounded) cy.$id(lp.id).connectedEdges('[kind="back"]').addClass('eyes');   // the way back
  }
  const e = $('eyes');
  e.hidden = !top.length || DECIDED;
  e.textContent = `${top.length} item${top.length === 1 ? '' : 's'} need${top.length === 1 ? 's' : ''} your eyes${total > top.length ? ` (of ${total})` : ''} →`;
}
function nextEyes(ev) {
  ev.preventDefault();
  if (!EYES.ids.length) return;
  EYES.at = (EYES.at + 1) % EYES.ids.length;
  const t = cy.$id(EYES.ids[EYES.at]);
  cy.$(':selected').unselect(); t.select(); select(t);
  cy.animate({ center: { eles: t }, duration: 200 });
}

// The last approved text of this path, if the hook vouches for it. A diff to read first — never a
// shortcut: Approve still needs the whole script approved, and unchanged nodes are dimmed, not hidden.
let DIFF = null;
async function showSinceApproval() {
  let b = null;
  try { b = await fetch(q('/approved')).then((r) => r.json()); } catch { return; }
  if (!b?.text || LIVE) return;
  const when = new Date(b.ts).toLocaleDateString([], { day: '2-digit', month: '2-digit' });
  let prev;
  try { prev = extract(b.text); } catch { return; }       // an unparseable baseline is no diff, not a broken page
  const s = $('since');
  s.hidden = false;
  if (b.text === SRC) { s.textContent = `Same text as your approval on ${when} — the gate re-opened for another reason (a plugin update)`; return; }
  DIFF = diffGraphs(prev, GRAPH, b.text, SRC);
  const parts = [DIFF.changed && `${DIFF.changed} agent${DIFF.changed === 1 ? '' : 's'} changed`, DIFF.added && `${DIFF.added} added`,
    DIFF.removed.length && `${DIFF.removed.length} removed (${DIFF.removed.join(', ')})`].filter(Boolean);
  s.textContent = `Since your approval on ${when}: ` + (parts.length ? parts.join(', ') + (DIFF.outside ? ', and code outside the agent calls changed — an unchanged call may read what it changed' : '') : 'no agent call changed — the difference is elsewhere in the script');
  if (parts.length) for (const [id, st] of Object.entries(DIFF.status)) cy.$id(id).addClass('diff-' + st);
  if (!$('panel').contains(document.activeElement)) renderPanel(cy.$('node:selected').first());
}

// Against the models as they are NOW, so an applied tier leaves the count and the price line at once.
function jevBanner() {
  const a = ADVICE;
  if (!a) return;
  const agents = GRAPH.nodes.filter((x) => x.kind === 'agent');
  const n = agents.filter((x) => a.agents[x.id]?.tier).length, low = agents.filter((x) => a.agents[x.id]?.low).length;
  const differ = agents.filter((x) => a.agents[x.id]?.tier && a.agents[x.id].tier !== currentModel(x)).length;
  $('jev').textContent = 'Jev: ' + [
    a.kind ? a.kind.choice : null,
    a.stakes ? 'stakes ' + a.stakes.text : null,
    n ? `tiers for ${n} agent${n === 1 ? '' : 's'}${differ ? ` (${differ} differ — select an agent to apply)` : ' (all as written)'}` : null,
    ...priceDelta(agents, a, currentModel),
    low ? `${low} low confidence` : null,
  ].filter(Boolean).join(' · ') + ' — agent missions were sent to api.typesafe.ai';
  $('jev').hidden = false;
}

// The page's heartbeat, and its view of the hook. The server tells a retrying hook this tab is still
// here (so it reattaches instead of opening another), and tells the page whether Claude is still
// waiting on it. Two stale reads before saying so: one late poll is not a verdict.
const hhmm = (t) => new Date(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
let hookStale = 0;
async function heartbeat() {
  if (DECIDED) return;
  let s; try { s = await fetch(q('/state')).then((r) => r.json()); } catch { return; }
  hookStale = s.hookWaiting === false ? hookStale + 1 : 0;
  HOOK_GONE = hookStale >= 2 ? s.hookLastPoll : 0;
  const w = $('waiting');
  if (!w) return;                                   // the error page replaced the header
  w.hidden = !HOOK_GONE;
  if (HOOK_GONE) w.textContent = `Claude stopped waiting at ${hhmm(HOOK_GONE)}. Approving records it for this file; tell Claude to retry.`;
}

// ---------------------------------------------------------------- boot
(async function () {
  // Wired before anything that can fail: an error page must still count its reader as present and
  // still let them cancel, or the agent is told nobody came and waits on a tab with no way out.
  // Tell the hook a human is here. `open` launches this tab whether or not anyone is at the desk,
  // so the page loading proves nothing; a pointer or a key does. Sent once.
  let seenSent = false;
  const seenOnce = () => { if (seenSent) return; seenSent = true; fetch(q('/seen'), { method: 'POST' }).catch(() => {}); };
  for (const ev of ['pointermove', 'pointerdown', 'keydown']) document.addEventListener(ev, seenOnce);
  const cancel = async () => {
    await fetch(q('/cancel'), { method: 'POST' }).catch(() => {});
    document.body.innerHTML = '<pre style="padding:24px">Cancelled. The gate is still active and nothing was changed.\nYou can close this tab.</pre>';
  };
  $('cancel').onclick = cancel;
  $('cap').addEventListener('input', () => { capTyped = true; });
  heartbeat(); setInterval(heartbeat, 5000);

  SRC = await fetch(q('/script')).then((r) => r.text());
  try {
    GRAPH = extract(SRC);
  } catch (e) {
    // No Approve here, ever: an unparsed script has no graph to have reviewed.
    document.body.innerHTML = `<pre style="padding:24px">Could not parse this script:\n\n${escapeHtml(e.message)}\n\nThe gate is still active. Approve it the usual way, from the terminal, or cancel it.</pre>`
      + `<p style="padding:0 24px"><button id="cancel">Cancel</button></p><pre style="padding:24px;opacity:.8">${escapeHtml(SRC)}</pre>`;
    $('cancel').onclick = cancel;
    return;
  }
  // The number being approved. `≥` is honest: guarded sites count 0, runtime fan-outs count 1.
  const fan = GRAPH.nodes.filter((n) => n.fanOut && n.fanOut.n === null).length;
  const guarded = GRAPH.nodes.filter((n) => n.guard).length;
  HDR =
    `≥ ${GRAPH.minAgents} agent${GRAPH.minAgents === 1 ? '' : 's'} will run · ${GRAPH.nodes.length} call site${GRAPH.nodes.length === 1 ? '' : 's'}`
    + (fan ? ` · ${fan} fan out over a runtime list` : '')
    + (guarded ? ` · ${guarded} conditional` : '')
    + (GRAPH.flags.loop ? ' · loop: count unbounded' : '')
    + (GRAPH.flags.budget ? ' · scales with the token budget' : '')
    + (GRAPH.phases.length ? ` · ${GRAPH.phases.join(' → ')}` : '');
  $('hdr').textContent = HDR;
  // Past spend of this workflow, next to the shape being approved. Silent without history.
  fetch(q('/priors')).then((r) => r.json()).then((p) => {
    const t = priorsText(p);
    if (!t) return;
    PRIORS = p;
    HDR += ' · ' + t;
    // A starting point for the cap, never over one the human typed: 1.5x what 3 in 4 past runs stayed under.
    if (!$('cap').value && !capTyped && !DECIDED && Number.isFinite(p.p75) && p.p75 > 0) $('cap').value = (p.p75 * 1.5).toFixed(2);
    if (!LIVE && !DECIDED) $('hdr').textContent = HDR;
    if (!$('panel').contains(document.activeElement)) renderPanel(cy?.$('node:selected').first());
  }).catch(() => {});
  // Reloaded while the run this tab approved is still going: come back as the live view. Without
  // this the page returns as an editor whose Approve button re-enables, 409s, and then reports
  // "the gate is still active" — which is false, and the run goes unwatched.
  fetch(q('/live')).then((r) => r.json()).then((live) => { if (live && live.running) goLive('watching the run this tab approved'); }).catch(() => {});
  // A previous run of this exact script? Then the graph can also show what actually happened.
  fetch(q('/run')).then((r) => r.json()).then((run) => {
    if (LIVE || POLL) return;      // a run is being watched right now; the last one is not the story
    if (!run || !run.agents?.length) return;
    RUN = run; matchRun(run);
    $('showrun').hidden = false;
    $('showrun').onclick = () => paintRun(!RUN_ON);
  }).catch(() => {});
  // A throw in build() used to leave a rendered-looking graph that ignored every click and an
  // Approve button that could never enable — a dead UI that looks alive. Fail loudly instead.
  try {
    build();
    refreshButtons();
  } catch (e) {
    $('status').className = 'status blocked';
    $('status').textContent = 'Editor failed to start: ' + e.message + ' — approve from the terminal instead.';
    $('approve').disabled = true;
    throw e;
  }

  if (HISTORY_URL) { $('history').href = HISTORY_URL; $('history').hidden = false; }
  $('undo').onclick = undo;
  $('redo').onclick = redo;
  document.addEventListener('keydown', (e) => {
    if (!(e.metaKey || e.ctrlKey)) return;
    if (e.key === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
    if (e.key === 'y' || (e.key === 'z' && e.shiftKey)) { e.preventDefault(); redo(); }
  });

  $('approve').onclick = async () => {
    $('approve').disabled = true;
    const script = applyEdits(SRC, GRAPH.nodes, edits);
    const n = Object.keys(edits).length;
    const summary = `${GRAPH.nodes.length} agent site(s)${fan ? ' incl. runtime fan-out' : ''}`
      + (GRAPH.phases.length ? `, phases ${GRAPH.phases.join('→')}` : '')
      + `, ${n ? n + ' edited in graph editor' : 'unedited'}`;
    // The cap rides along with the approval but is not part of it: a bad value is no cap, never a refusal.
    const cap = Number($('cap').value) > 0 ? Number($('cap').value) : null;
    // Asked on the click (a user gesture), not awaited: the approval must not wait on a permission prompt.
    try { if (cap && window.Notification?.permission === 'default') Notification.requestPermission().catch(() => {}); } catch {}
    const res = await fetch(q('/approve'), {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ script, summary, match: matchNeedles(), cap }),
    });
    const text = await res.text();
    if (!res.ok) {
      document.body.innerHTML = `<pre style="padding:24px">${escapeHtml('Approval failed, the gate is still active:\n' + text)}</pre>`;
      return;
    }
    goLive(text);
  };
  // Review aids last: Approve, undo and redo are wired whether or not any of these throws.
  refreshEyes();
  $('eyes').onclick = nextEyes;
  showSinceApproval();
  askAdvice();
})();
</script>
